name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build

      - name: Smoke-test built wheel
        run: |
          uv venv --no-project wheel-venv
          uv pip install --python wheel-venv/bin/python dist/*.whl
          wheel-venv/bin/python -c "from demo_engine import DemoEngine"
          wheel-venv/bin/demo-mcp --help
